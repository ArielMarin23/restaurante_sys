{% extends "base.html" %}
{% block mi_css %}
<!-- Select2 -->
<link rel="stylesheet" href="{{url_for('static', filename='plugins/select2/css/select2.min.css')}}">
<link rel="stylesheet"
  href="{{url_for('static', filename='plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css')}}">
{% endblock %}
{% block contenido_principal %}
<!-- contenido de cabezera (cabezera de pagina) -->
<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1>Cierre de Caja</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="{{url_for('inicio.index')}}">Inicio</a></li>
          <li class="breadcrumb-item active">Cierre de Caja</li>
        </ol>
      </div>
    </div>
  </div>
</section>
<!-- fin cabecera -->
<section class="content" style="width: 50%; margin: auto;">
  <div class="container-fluid">
    <div class="card card-primary">
      <div class="card-header">
        <h3 class="card-title">Registrar Cierre de Caja</h3>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
      <form >
        <div class="card-body">
          <div class="form-group">
            <label for="exampleInputEmail1">Numero de Cierre</label>
            <h1>000-02254-444</h1>
          </div>
          <div class="row">
            <!-- collumna 1 -->
            <div class="col-md-6">
              <div class="form-group">
                <label for="exampleInputPassword1">Numero de Caja</label>
                <select class="custom-select">
                  <option>Caja 1</option>
                  <option>Caja 2</option>
                </select>
              </div>
              <div class="form-group">
                <label for="#">Fecha Cierre</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                  </div>
                  <input type="text" class="form-control input" data-inputmask-alias="datetime"
                    data-inputmask-inputformat="dd/mm/yyyy" data-mask>
                </div>
              </div>
            </div>
            <!-- /.columna 1 -->
            <!-- columna 2 -->
            <div class="col-md-6">
              <div class="form-group">
                <label>Sucursal</label>
                <select class="form-control select2bs4" style="width: 100%;">
                  <option selected="selected">Lambare</option>
                  <option>Ñemby</option>
                </select>
              </div>
              <div class="form-group">
                <label for="#">Hora Cierre</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="far fa-clock"></i></span>
                  </div>
                  <input type="text" class="form-control input" data-inputmask-alias="datetime"
                    data-inputmask-inputformat="dd/mm/yyyy" data-mask>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Monto Final</label>
            <input type="text" class="form-control" id="montoInicial" value="0" readonly>
          </div>
          <!-- /.collumna 2 -->
          <!-- /.card-body -->
      </form>
    </div>
    <div class="card-footer">
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </div>
  </div>
</section>
{% endblock %}
{% block mi_javascript %}
<!-- Select2 -->
<script src="{{ url_for('static', filename='plugins/select2/js/select2.full.min.js') }}"></script>
{% endblock %}
